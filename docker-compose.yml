services:
  api:
    build: .
    ports:
      - "8080:8080"     # REST
      - "50051:50051"   # gRPC
    environment:
      MONGO_URI: mongodb://mongo:27017
      DB_NAME: userdb
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (min 32 bytes)}
      TOKEN_TTL: ${TOKEN_TTL:-1h}
      HTTP_PORT: "8080"
      GRPC_PORT: "50051"
      WORKER_INTERVAL: ${WORKER_INTERVAL:-10s}
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  mongo:
    image: mongo:8
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  mongo-data:
